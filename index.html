<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRUD Google Sheets</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container py-3">
  <h4>📊 ระบบจัดการข้อมูลจาก Google Sheets</h4>

  <!-- ➕ FORM -->
  <div class="card p-3 mb-3">
    <input id="name" class="form-control mb-2" placeholder="ชื่อ">
    <input id="detail" class="form-control mb-2" placeholder="รายละเอียด">
    <button onclick="addData()" class="btn btn-success w-100">➕ เพิ่ม</button>
  </div>

  <!-- 🔍 SEARCH -->
  <input id="search" class="form-control mb-3" placeholder="ค้นหา...">

  <!-- TABLE -->
  <div class="table-responsive">
    <table class="table table-bordered table-sm">
      <thead class="table-dark" id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
